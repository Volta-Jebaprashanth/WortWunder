name: ✨ Feature request
description: Suggest a new lesson, exercise or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: e.g. "I keep forgetting plural forms, and there's no way to practise them."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
